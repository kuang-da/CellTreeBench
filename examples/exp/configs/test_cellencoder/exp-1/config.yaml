exp_id: exp-1
seed: 123

data:
  dataset_name: celltreeqm_dataset/lg_bd_ntips100_len5000
  lineage_name: celltreeqm-lg-bd
  dataset_names:
    train: 0.5
    test: 0.5
  autosplit: sites

training:
  batch_size: 4096
  lr: 0.0001
  num_epochs: 20
  eval_interval: 400

loss:
  weight_gate: -1.0
  weight_decay: 0.001
  weight_D: 1
  weight_P: 20.0
  weight_close: 1.0
  weight_push: 1.0
  push_margin: 0.1
  distance_error_alpha: 1  

model:
  metric: euclidean
  metric_loss: additivity
  cell_encoder_type: site_transformer  # linear, site_transformer
  # CellTreeQM ----------------------
  proj_dim: 512
  output_dim: 128
  hidden_dim: 512
  num_heads: 4
  num_layers: 8
  dropout_data: 0.1
  dropout_metric: 0.1
  norm_method: batch_norm
  gate_type: none  
  # CellEncoder ----------------------
  site_alphabet_size: 22
  site_embed_dim: 128
  site_encoder_heads: 4
  site_encoder_layers: 2
  site_dropout: 0.1
