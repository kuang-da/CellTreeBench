exp_id: "exp-single-tree-fullysup-l2sq"
seed: 123

data:
  dataset_name: "celltreeqm_dataset/lg_bd_ntips100_len5000"
  autosplit: "sites"
  lineage_name: "celltreeqm-lg-bd"

model:
  cell_encoder_type: "site_setpool"
  proj_dim: 512
  output_dim: 256
  hidden_dim: 512
  num_layers: 2
  num_heads: 4
  dropout_data: 0.0
  dropout_metric: 0.05
  norm_method: "pre_ln"
  gate_type: "none"
  site_alphabet_size: 22
  site_embed_dim: 32
  site_encoder_heads: 4
  site_encoder_layers: 1
  site_dropout: 0.1
  site_pma_seeds: 8
  site_chunk_size: 1
  init_mode: "mds_l2sq"

training:
  batch_size: 4096
  lr: 3.0e-4
  optimizer: "adamw"
  weight_decay: 5.0e-5
  num_epochs: 20
  warmup_steps: 500
  p_warmup_steps: 2000
  eval_interval: 300
  grad_clip: 1.0
  multiview: false

  pair_sampling:
    mode: "bucket_equal"
    bins: 10
    long_pair_boost: 1.5

loss:
  D_align: "affine"
  distance_error_alpha: 0.75
  weight_D: 1.0
  d_loss: "l2sq_huber"
  huber_delta: 0.05

  weight_P: 6.0
  weight_close: 1.0
  weight_push: 5.0
  push_margin: 0.10
  adaptive_P: true
  adaptive_P_ema: 0.95
  adaptive_P_target_ratio: 0.4
  adaptive_P_cap_max: 1.0
  cap_by_act: true
  cap_by_act_floor: 0.6
  consistency_weight: 0.3
  metric: "euclidean"
  metric_loss: "additivity"
  scale_anchor: 0.05

schedule:
  phaseA_steps: 1500
  phaseB_ramp_steps: 2000

scale_safety:
  sentry_enabled: true
  threshold: 0.25
  window_steps: 50
  grad_clip_during_sentry: 0.5
  p_weight_drop_on_sentry: 0.2

evaluation:
  nj_from_embedding: true
  report_bins: true
  save_plots: true

